name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-typescript:
    name: TypeScript Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Dependencies
        id: npm-ci
        run: npm ci

      - name: Check Format
        id: npm-format-check
        run: npm run format:check

      - name: Lint
        id: npm-lint
        run: npm run lint

  test-wip:
    name: Test Workload Identity Federation
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Test Local Action
        id: test-action
        uses: ./
        with:
          workload_identity_provider: iam/project/c9a34373-d6dc-4043-b5e6-4fe257d7cea5/service-principal/test-cli/workload-identity-provider/github-test

      - name: Print Output
        id: output
        run: |
          echo "${{ steps.test-action.outputs.organization_id }}"
          echo "${{ steps.test-action.outputs.project_id }}"
          echo "${{ steps.test-action.outputs.credentials_file_path }}"
          cat "${{ steps.test-action.outputs.credentials_file_path }}"

  test-sp-creds:
    name: Test Service Principal Credentials
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Test Local Action
        id: test-action
        uses: ./
        with:
          client_id: ${{ secrets.TEST_SP_CLIENT_ID }}
          client_secret: ${{ secrets.TEST_SP_CLIENT_SECRET }}

      - name: Print Output
        id: output
        run: |
          echo "${{ steps.test-action.outputs.organization_id }}"
          echo "${{ steps.test-action.outputs.project_id }}"
